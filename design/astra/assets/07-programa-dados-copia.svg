<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
<title id="title">O programa não carrega sozinho a sua lista</title><desc id="desc">app.html contém as instruções. As tarefas ficam no armazenamento daquele navegador quando o salvamento funciona. Exportar cria uma cópia JSON dos dados; importar essa cópia permite substituir a lista após confirmação.</desc>
<style>text{font-family:Figtree,Arial,sans-serif} .literal{direction:ltr;unicode-bidi:isolate}</style>
<rect width="1200" height="615" rx="28" fill="#F5F3FB"/>
<text x="40" y="47" font-size="16" letter-spacing="2" fill="#6C3BEE" font-weight="700">GANESHA · DEMONSTRAÇÃO PREPARADA</text>
<text x="40" y="96" font-size="32" font-weight="700" fill="#17151F">O programa não carrega sozinho a sua lista</text>
<text x="40" y="140" font-size="19" font-weight="400" fill="#625B70">Separar instruções, armazenamento e cópia ajuda a entender a recuperação.</text>
<rect x="40.0" y="190" width="360.0" height="320" rx="18" fill="white" stroke="#DED8E9"/>
<circle cx="72.0" cy="224" r="14" fill="#EDE6FD"/>
<text x="72.0" y="230" text-anchor="middle" font-size="16" fill="#6C3BEE" font-weight="700">1</text>
<text x="97.0" y="231" font-size="18" font-weight="700" fill="#17151F">Programa</text>
<text x="64.0" y="274" font-size="20" font-weight="600" fill="#6C3BEE">app.html</text>
<text x="64.0" y="316" font-size="20" font-weight="400" fill="#17151F">Instruções de funcionamento</text>
<text x="64.0" y="358" font-size="20" font-weight="400" fill="#17151F">Não é uma cópia das tarefas.</text>
<rect x="420.0" y="190" width="360.0" height="320" rx="18" fill="white" stroke="#DED8E9"/>
<circle cx="452.0" cy="224" r="14" fill="#EDE6FD"/>
<text x="452.0" y="230" text-anchor="middle" font-size="16" fill="#6C3BEE" font-weight="700">2</text>
<text x="477.0" y="231" font-size="18" font-weight="700" fill="#17151F">Dados no navegador</text>
<text x="444.0" y="274" font-size="20" font-weight="400" fill="#17151F">4 tarefas de exemplo</text>
<text x="444.0" y="316" font-size="20" font-weight="400" fill="#17151F">Dependem do ambiente</text>
<text x="444.0" y="358" font-size="20" font-weight="600" fill="#923B25">Podem ser apagados</text>
<rect x="800.0" y="190" width="360.0" height="320" rx="18" fill="white" stroke="#DED8E9"/>
<circle cx="832.0" cy="224" r="14" fill="#EDE6FD"/>
<text x="832.0" y="230" text-anchor="middle" font-size="16" fill="#6C3BEE" font-weight="700">3</text>
<text x="857.0" y="231" font-size="18" font-weight="700" fill="#17151F">Cópia exportada</text>
<text x="824.0" y="274" font-size="20" font-weight="600" fill="#6C3BEE">tarefas-aurora-copia.json</text>
<text x="824.0" y="316" font-size="20" font-weight="400" fill="#17151F">Arquivo explícito dos dados</text>
<text x="824.0" y="358" font-size="20" font-weight="400" fill="#17151F">Exportar → guardar</text>
<text x="824.0" y="400" font-size="20" font-weight="400" fill="#17151F">Importar → conferir →</text><text x="824.0" y="428" font-size="20" font-weight="400" fill="#17151F">confirmar</text>
<text x="40" y="577" font-size="18" font-weight="400" fill="#625B70">Copiar o HTML não transfere automaticamente os dados guardados no navegador.</text>
</svg>