<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
<title id="title">O mesmo conteúdo, em três lugares</title><desc id="desc">O texto HTML é salvo como site.html na pasta oficina-aurora. O navegador abre esse arquivo e mostra o título Oficina Aurora. Salvar e recarregar permite observar uma alteração.</desc>
<style>text{font-family:Figtree,Arial,sans-serif} .literal{direction:ltr;unicode-bidi:isolate}</style>
<rect width="1200" height="615" rx="28" fill="#F5F3FB"/>
<text x="40" y="47" font-size="16" letter-spacing="2" fill="#6C3BEE" font-weight="700">GANESHA · DEMONSTRAÇÃO PREPARADA</text>
<text x="40" y="96" font-size="32" font-weight="700" fill="#17151F">O mesmo conteúdo, em três lugares</text>
<text x="40" y="140" font-size="19" font-weight="400" fill="#625B70">Receber código, salvar um arquivo e abrir uma página são ações diferentes.</text>
<rect x="40.0" y="190" width="360.0" height="320" rx="18" fill="white" stroke="#DED8E9"/>
<circle cx="72.0" cy="224" r="14" fill="#EDE6FD"/>
<text x="72.0" y="230" text-anchor="middle" font-size="16" fill="#6C3BEE" font-weight="700">1</text>
<text x="97.0" y="231" font-size="18" font-weight="700" fill="#17151F">Trecho no editor</text>
<text x="64.0" y="274" font-size="20" font-weight="400" fill="#17151F">&lt;h1&gt;Oficina Aurora&lt;/h1&gt;</text>
<text x="64.0" y="316" font-size="20" font-weight="400" fill="#17151F">HTML é texto com instruções</text><text x="64.0" y="344" font-size="20" font-weight="400" fill="#17151F">para a página.</text>
<text x="64.0" y="386" font-size="20" font-weight="600" fill="#6C3BEE">Salvar como site.html</text>
<rect x="420.0" y="190" width="360.0" height="320" rx="18" fill="white" stroke="#DED8E9"/>
<circle cx="452.0" cy="224" r="14" fill="#EDE6FD"/>
<text x="452.0" y="230" text-anchor="middle" font-size="16" fill="#6C3BEE" font-weight="700">2</text>
<text x="477.0" y="231" font-size="18" font-weight="700" fill="#17151F">Arquivo na pasta</text>
<text x="444.0" y="274" font-size="20" font-weight="400" fill="#17151F">oficina-aurora/</text>
<text x="444.0" y="316" font-size="20" font-weight="400" fill="#17151F">└ site.html</text>
<text x="444.0" y="358" font-size="20" font-weight="400" fill="#17151F">Confira o nome completo.</text>
<text x="444.0" y="400" font-size="20" font-weight="600" fill="#923B25">site.html.txt é outro nome</text>
<rect x="800.0" y="190" width="360.0" height="320" rx="18" fill="white" stroke="#DED8E9"/>
<circle cx="832.0" cy="224" r="14" fill="#EDE6FD"/>
<text x="832.0" y="230" text-anchor="middle" font-size="16" fill="#6C3BEE" font-weight="700">3</text>
<text x="857.0" y="231" font-size="18" font-weight="700" fill="#17151F">Página no navegador</text>
<text x="824.0" y="274" font-size="20" font-weight="600" fill="#6C3BEE">Oficina Aurora</text>
<text x="824.0" y="316" font-size="20" font-weight="400" fill="#17151F">Cuidados com plantas em vasos</text>
<text x="824.0" y="358" font-size="20" font-weight="400" fill="#17151F">Sábado · 15h às 17h</text>
<text x="824.0" y="400" font-size="20" font-weight="400" fill="#17151F">Após uma mudança: salvar e</text><text x="824.0" y="428" font-size="20" font-weight="400" fill="#17151F">recarregar.</text>
<text x="40" y="577" font-size="18" font-weight="400" fill="#625B70">Ilustração conceitual. Não representa menus de uma ferramenta ou sistema operacional.</text>
</svg>